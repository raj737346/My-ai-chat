<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My AI Chat</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #fff; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden;
        }
        
        /* Top Navigation Bar */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #fff;
        }
        .nav-left, .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .nav-icon {
            background: none;
            border: none;
            cursor: pointer;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        /* Main Chat Area */
        .header { 
            text-align: center; 
            padding: 10px 10px 20px 10px; 
        }
        .header h2 {
            font-size: 22px;
            color: #333;
            font-weight: 600;
        }
        .chat-container { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
        }
        .message { 
            max-width: 80%; 
            padding: 10px 15px; 
            border-radius: 18px; 
            margin-bottom: 10px; 
            line-height: 1.4;
            font-size: 15px;
        }
        .user-msg { 
            background-color: #1E88E5; 
            color: white; 
            align-self: flex-end; 
            border-bottom-right-radius: 4px; 
        }
        .bot-msg { 
            background-color: #f0f0f0; 
            color: black; 
            align-self: flex-start; 
            border-bottom-left-radius: 4px; 
        }
        
        /* Bottom Input Area */
        .input-wrapper { 
            padding: 10px 15px 20px 15px;
            background-color: #fff;
        }
        .input-box {
            display: flex;
            flex-direction: column;
            background-color: #f4f4f4;
            border-radius: 24px;
            padding: 10px 15px;
        }
        .input-row {
            display: flex;
            align-items: center;
        }
        .input-row input { 
            flex: 1; 
            background: transparent;
            border: none; 
            outline: none; 
            font-size: 16px;
            color: #333;
            padding: 5px 0;
        }
        .input-row input::placeholder {
            color: #999;
        }
        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .action-left {
            display: flex;
            gap: 8px;
        }
        .pill-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #ddd;
            background-color: #fff;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            cursor: pointer;
        }
        .pill-btn.active {
            background-color: #e8f0fe;
            color: #1E88E5;
            border-color: #e8f0fe;
        }
        .action-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .send-btn {
            background-color: #1E88E5;
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-left: 5px;
        }
        .send-btn:disabled {
            background-color: #ccc;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar (படத்தில் உள்ளது போல) -->
    <div class="top-nav">
        <div class="nav-left">
            <button class="nav-icon">
                <!-- Menu Icon (Two lines) -->
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="8" x2="21" y2="8"></line><line x1="3" y1="16" x2="15" y2="16"></line></svg>
            </button>
        </div>
        <div class="nav-right">
            <button class="nav-icon">
                <!-- Mute Icon -->
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
            </button>
            <button class="nav-icon">
                <!-- Plus/Chat Icon -->
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
            </button>
        </div>
    </div>

    <!-- Header Text -->
    <div class="header">
        <h2>Hello, let's start chatting</h2>
    </div>

    <!-- Chat Messages -->
    <div class="chat-container" id="chatBox">
        <!-- Messages will appear here -->
    </div>

    <!-- Input Area -->
    <div class="input-wrapper">
        <div class="input-box">
            <div class="input-row">
                <input type="text" id="userInput" placeholder="Type a message or hold to speak">
            </div>
            <div class="action-row">
                <div class="action-left">
                    <button class="pill-btn" onclick="this.classList.toggle('active')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M8 12h8"></path><path d="M12 8v8"></path></svg>
                        Think
                    </button>
                    <button class="pill-btn active" onclick="this.classList.toggle('active')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        Search
                    </button>
                </div>
                <div class="action-right">
                    <button class="icon-btn">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                    </button>
                    <button class="icon-btn">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
                    </button>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const sendBtn = document.getElementById('sendBtn');
            const userText = inputField.value.trim();

            if (userText === "") return;

            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            userDiv.innerText = userText;
            chatBox.appendChild(userDiv);
            inputField.value = "";

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot-msg';
            loadingDiv.innerText = "Thinking...";
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            sendBtn.disabled = true;

            try {
                const response = await fetchAIResponse(userText);
                loadingDiv.innerText = response;
            } catch (error) {
                loadingDiv.innerText = "Error: " + error.message;
            }
            
            sendBtn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Temporary Demo AI
        async function fetchAIResponse(text) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve("நான் ஒரு AI. நீங்கள் சொன்னது: " + text);
                }, 1000);
            });
        }
    </script>
</body>
</html>
